[project]
name = "risk-engine"
version = "0.1.0"
description = "Market risk modelling toolkit: volatility estimation, VaR/ES, backtesting, API, dashboard."
requires-python = ">=3.11"
readme = "README.md"

# --- Core dependencies -------------------------------------------------
# We are declaring the full dependency list now (even though phases 1-3
# only need the first few) so that "pip install -e .[dev]" once, today,
# sets you up for the whole project. You will not touch this file again
# until you add something genuinely new.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "arch>=6.3",            # GARCH family models
    "yfinance>=0.2",        # market data
    "sqlalchemy>=2.0",      # database layer
    "fastapi>=0.110",       # API framework (phase 5)
    "uvicorn[standard]>=0.29",  # ASGI server to run FastAPI
    "pydantic>=2.6",        # request/response schema validation
    "streamlit>=1.32",      # dashboard (phase 6)
    "plotly>=5.20",         # interactive charts in the dashboard
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "yfinance>=0.2",
]

# --- Dev-only dependencies ----------------------------------------------
# Installed with: pip install -e ".[dev]"
# Never shipped to production — these are tools that help YOU, not the app.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",        # test runner
    "pytest-cov>=5.0",    # test coverage reporting
    "ruff>=0.4",          # fast linter (catches bugs, unused imports, style issues)
    "black==24.4.2",      # pinned to match .pre-commit-config.yaml's rev, so CI/local/pre-commit all agree
    "pre-commit>=3.7",    # runs black/ruff automatically before every commit
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- Tool configuration ---------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
